[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tech-news-ig-bot"
version = "0.1.0"
description = "Discover emerging technology news and render Instagram-ready posts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow",
]

[project.scripts]
tech-ig-bot = "tech_ig_bot.cli:main"

[tool.setuptools.packages.find]
include = ["tech_ig_bot*"]
